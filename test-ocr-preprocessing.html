<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR Preprocessing Test</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #1a1a2e;
      color: #eee;
    }
    h1 { color: #ffd700; }
    .container { display: flex; gap: 20px; flex-wrap: wrap; }
    .image-box {
      flex: 1;
      min-width: 300px;
      background: #16213e;
      padding: 15px;
      border-radius: 8px;
    }
    .image-box h3 { margin-top: 0; color: #0ea5e9; }
    canvas, img {
      max-width: 100%;
      border: 1px solid #333;
    }
    input[type="file"] {
      margin: 10px 0;
      padding: 10px;
      background: #0f3460;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
    }
    .controls {
      background: #16213e;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
    }
    input[type="range"] { flex: 1; max-width: 300px; }
    .value { color: #ffd700; min-width: 50px; }
  </style>
</head>
<body>
  <h1>OCR Preprocessing Visualizer</h1>
  <p>Upload a Warframe inventory screenshot to see how preprocessing transforms the image for OCR.</p>
  
  <input type="file" id="imageInput" accept="image/*">
  
  <div class="controls">
    <h3>Preprocessing Parameters</h3>
    <label>
      Gold threshold (R>G): 
      <input type="range" id="goldThreshold" min="100" max="200" value="150">
      <span class="value" id="goldValue">150</span>
    </label>
    <label>
      White threshold: 
      <input type="range" id="whiteThreshold" min="150" max="230" value="180">
      <span class="value" id="whiteValue">180</span>
    </label>
    <label>
      Luminance threshold: 
      <input type="range" id="lumThreshold" min="100" max="200" value="140">
      <span class="value" id="lumValue">140</span>
    </label>
  </div>
  
  <div class="container">
    <div class="image-box">
      <h3>Original Image</h3>
      <canvas id="originalCanvas"></canvas>
    </div>
    <div class="image-box">
      <h3>Preprocessed (Black text on white)</h3>
      <canvas id="processedCanvas"></canvas>
    </div>
  </div>

  <script>
    const originalCanvas = document.getElementById('originalCanvas');
    const processedCanvas = document.getElementById('processedCanvas');
    const originalCtx = originalCanvas.getContext('2d');
    const processedCtx = processedCanvas.getContext('2d');
    
    let currentImage = null;
    
    // Get threshold values
    const getThresholds = () => ({
      gold: parseInt(document.getElementById('goldThreshold').value),
      white: parseInt(document.getElementById('whiteThreshold').value),
      lum: parseInt(document.getElementById('lumThreshold').value)
    });
    
    // Update value displays
    document.querySelectorAll('input[type="range"]').forEach(input => {
      input.addEventListener('input', () => {
        document.getElementById(input.id.replace('Threshold', 'Value')).textContent = input.value;
        if (currentImage) processImage(currentImage);
      });
    });
    
    // Preprocess image function (matching ocrService.ts)
    function preprocessImage(ctx, width, height, thresholds) {
      const imageData = ctx.getImageData(0, 0, width, height);
      const data = imageData.data;
      
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        
        const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
        
        const isGoldText = r > thresholds.gold && g > 120 && b < 150 && r > b * 1.2;
        const isWhiteText = r > thresholds.white && g > thresholds.white && b > thresholds.white;
        const isBrightText = luminance > thresholds.lum;
        
        if (isGoldText || isWhiteText || isBrightText) {
          // Text becomes black
          data[i] = 0;
          data[i + 1] = 0;
          data[i + 2] = 0;
        } else {
          // Background becomes white
          data[i] = 255;
          data[i + 1] = 255;
          data[i + 2] = 255;
        }
      }
      
      ctx.putImageData(imageData, 0, 0);
    }
    
    function processImage(img) {
      currentImage = img;
      const thresholds = getThresholds();
      
      // Draw original
      originalCanvas.width = img.width;
      originalCanvas.height = img.height;
      originalCtx.drawImage(img, 0, 0);
      
      // Draw and process copy
      processedCanvas.width = img.width;
      processedCanvas.height = img.height;
      processedCtx.drawImage(img, 0, 0);
      preprocessImage(processedCtx, img.width, img.height, thresholds);
    }
    
    document.getElementById('imageInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const img = new Image();
      img.onload = () => processImage(img);
      img.src = URL.createObjectURL(file);
    });
  </script>
</body>
</html>
