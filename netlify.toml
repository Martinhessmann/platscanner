[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18.20.5"

# 1. Proxy for Warframe Market API (V2) - must be BEFORE SPA catch-all
[[redirects]]
  from = "/api/warframe-market/*"
  to = "https://api.warframe.market/v2/:splat"
  status = 200
  force = true
  headers = {Accept = "application/json", Language = "en", Platform = "pc", Access-Control-Allow-Origin = "*"}

# 2. Handle SPA routing - must be LAST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https://aistudio.google.com https://generativelanguage.googleapis.com https://warframe.market https://api.warframe.market; img-src 'self' data: blob: https://warframe.market https://api.iconify.design; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net https://*.jsdelivr.net; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' blob: https://generativelanguage.googleapis.com https://warframe.market https://api.warframe.market https://dbhdxrdjlwgclblmoypj.supabase.co https://cdn.jsdelivr.net https://*.jsdelivr.net https://unpkg.com https://tessdata.projectnaptha.com https://llmwhisperer-api.eu-west.unstract.com;"